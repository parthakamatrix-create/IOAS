{% extends "layout.html" %}

{% block content %}
<div class="row mb-4">
    <div class="col">
        <h2><i class="fab fa-whatsapp text-success"></i> WhatsApp Alerts Log</h2>
        <p class="text-muted">View the latest messages sent to user groups.</p>
        <a href="/" class="btn btn-sm btn-outline-secondary"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </div>
</div>

<div class="row">
    <div class="col-md-8 mx-auto">
        {% if messages %}
            <div class="card">
                <div class="card-header bg-success text-white">
                    Latest Alerts Batch
                </div>
                <div class="card-body bg-light">
                    {% for msg in messages %}
                        <div class="bg-white p-3 rounded mb-3 shadow-sm border" style="white-space: pre-wrap; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">{{ msg }}</div>
                    {% endfor %}
                </div>
            </div>
        {% else %}
            <div class="alert alert-info text-center">
                <i class="fas fa-info-circle fa-2x mb-3"></i><br>
                No alerts have been sent yet. 
                <br><br>
                <form action="{{ url_for('send_alerts') }}" method="POST">
                    <button type="submit" class="btn btn-success">Send First Batch</button>
                </form>
            </div>
        {% endif %}
    </div>
</div>
{% endblock %}
